<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Agency 8 — Settings</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body   { width: auto; max-width: 560px; margin: 0 auto; padding: 28px 24px; }
    h1     { font-size: 18px; font-weight: 700; margin-bottom: 2px; }
    .sub   { color: #8b949e; font-size: 12px; margin-bottom: 28px; }

    section        { margin-bottom: 28px; }
    section h2     { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px;
                     color: #8b949e; font-weight: 600; margin-bottom: 10px; }

    .oauth-row     { display: flex; gap: 8px; align-items: flex-start; }
    .oauth-row input { flex: 1; }

    .redirect-box  {
      background: #161b22; border: 1px solid #30363d; border-radius: 5px;
      padding: 8px 10px; font-family: monospace; font-size: 11px;
      color: #8b949e; word-break: break-all; margin-top: 6px;
    }
    .copy-btn {
      background: #21262d; border: 1px solid #30363d; border-radius: 4px;
      color: #f0f0f0; cursor: pointer; font-size: 11px; padding: 4px 10px;
      margin-top: 4px;
    }
    .copy-btn:hover { background: #30363d; }

    .client-list   { margin-bottom: 12px; }
    .client-row    {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 0; border-bottom: 1px solid #21262d;
    }
    .client-name   { flex: 1; font-size: 13px; }
    .client-id     { flex: 2; font-size: 11px; color: #8b949e; font-family: monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .btn-remove    {
      background: none; border: 1px solid #30363d; border-radius: 4px;
      color: #8b949e; cursor: pointer; font-size: 11px; padding: 3px 8px; flex-shrink: 0;
    }
    .btn-remove:hover { border-color: #f85149; color: #f85149; }

    .add-row       { display: flex; gap: 8px; margin-top: 10px; }
    .add-row input { flex: 1; }

    .btn-save {
      background: #238636; border: none; border-radius: 5px;
      color: #fff; cursor: pointer; font-size: 12px; font-weight: 600; padding: 7px 16px;
    }
    .btn-save:hover { background: #2ea043; }

    .btn-signout {
      background: none; border: 1px solid #30363d; border-radius: 5px;
      color: #8b949e; cursor: pointer; font-size: 12px; padding: 7px 16px;
    }
    .btn-signout:hover { border-color: #f85149; color: #f85149; }

    .saved { color: #3fb950; font-size: 12px; margin-left: 8px; opacity: 0; transition: opacity 0.3s; }
    .saved.show { opacity: 1; }

    .btn-reset {
      background: none; border: 1px solid #30363d; border-radius: 5px;
      color: #8b949e; cursor: pointer; font-size: 12px; padding: 7px 16px;
    }
    .btn-reset:hover { border-color: #8b949e; color: #f0f0f0; }
  </style>
</head>
<body>
  <h1>Agency 8</h1>
  <div class="sub">Chrome Extension Settings</div>

  <!-- OAuth setup -->
  <section>
    <h2>Google OAuth</h2>
    <p style="font-size:12px; color:#8b949e; margin-bottom:8px; line-height:1.5;">
      Paste your Google OAuth 2.0 Client ID below.<br>
      You'll need to add the Redirect URI shown here to your Google Cloud project.
    </p>
    <div class="oauth-row">
      <input type="text" id="oauth-client-id" placeholder="xxxxxxxx.apps.googleusercontent.com">
      <button class="btn-save" id="btn-save-oauth">Save</button>
      <span class="saved" id="saved-oauth">Saved</span>
    </div>
    <div style="margin-top:10px;">
      <div style="font-size:11px; color:#8b949e; margin-bottom:4px;">Your Redirect URI (add this in Google Cloud Console):</div>
      <div class="redirect-box" id="redirect-uri">Loading…</div>
      <button class="copy-btn" id="btn-copy-redirect">Copy</button>
    </div>
  </section>

  <!-- Client sheets -->
  <section>
    <h2>Client Master Lists</h2>
    <div class="client-list" id="client-list"></div>
    <div class="add-row">
      <input type="text" id="new-name" placeholder="Client name">
      <input type="text" id="new-id"   placeholder="Sheet ID">
      <button class="btn-save" id="btn-add-client">Add</button>
    </div>
    <div style="margin-top:12px;">
      <button class="btn-reset" id="btn-reset-clients">Reset to defaults</button>
      <span class="saved" id="saved-reset">Reset</span>
    </div>
  </section>

  <!-- Sign out -->
  <section>
    <h2>Account</h2>
    <button class="btn-signout" id="btn-signout">Sign out of Google</button>
  </section>

  <script src="options.js"></script>
</body>
</html>
